[project]
name = "find-backend"
version = "1.1.3"
description = "FastAPI backend and RQ worker for Find"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]>=0.52.1,<0.53",
  "python-multipart>=0.0.32,<0.1",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "alembic>=1.18.5,<2",
  "psycopg2-binary>=2.9.11,<3",
  "pgvector==0.5.0",
  "minio==7.2.20",
  "redis==8.1.0",
  "rq>=2.10.0,<3",
  "pillow>=12.3.0",
  "numpy==1.26.3",
  "piexif==1.1.3",
  "cryptography>=50.0.0,<51",
  "passlib[bcrypt]==1.7.4",
  "argon2-cffi>=23.1.0",
  "python-dotenv==1.2.2",
  "httpx>=0.28.1,<0.29",
  "aiofiles>=25.1.0,<26",
  "slowapi>=0.1.10",
]

[project.optional-dependencies]
mock = [
  "scikit-learn==1.9.0",
]
cpu = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers>=5.14.1,<6",
  "open-clip-torch>=2.24.0",
  "opencv-python-headless==4.9.0.80",
  "ultralytics>=8.4.112",
  "insightface==0.7.3",
  "onnxruntime==1.28.0",
  "timm>=1.0.28",
  "einops>=0.8.0",
  "paddlepaddle>=3.3.1,<3.4",
  "paddleocr>=3.7.0,<4",
  "scikit-learn==1.9.0",
  "cython<4",
]
nvidia = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers>=5.14.1,<6",
  "open-clip-torch>=2.24.0",
  "opencv-python-headless==4.9.0.80",
  "ultralytics>=8.4.112",
  "insightface==0.7.3",
  "onnxruntime-gpu==1.28.0",
  "timm>=1.0.28",
  "einops>=0.8.0",
  "paddlepaddle>=3.3.1,<3.4",
  "paddleocr>=3.7.0,<4",
  "scikit-learn==1.9.0",
  "cython<4",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "black==26.5.1",
  "ruff==0.16.1",
  "pip-audit==2.10.1",
  "scikit-learn==1.9.0",
  # Used only by the standalone OCR benchmark scripts (scripts/benchmark_ocr_variants.py
  # for RSS sampling, scripts/score_ocr_accuracy.py for edit distance).
  "psutil>=7.2.2",
  "python-levenshtein>=0.27.3",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pin the rule set explicitly rather than inheriting whatever ruff defaults to.
# Ruff changes its default selection between releases: 0.16 turned on B, BLE, I,
# S, SIM, UP, RUF and more, which surfaced 874 findings on an otherwise
# unchanged tree and was the only thing blocking the 0.1.14 -> 0.16 bump.
# Selecting here means the lint surface changes when we decide to change it,
# not as a side effect of bumping the linter.
#
# This is ruff's own stable default — pyflakes plus the pycodestyle errors that
# catch real mistakes rather than formatting noise — so it is exactly the
# baseline the backend was already green on under 0.1.14.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "nvidia" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "nvidia" },
]

[tool.uv]
# setuptools arrives transitively (torch, pip-audit) and resolved to 82.0.1,
# which is GHSA-affected (<83.0.0). The build-system pin above only governs
# building this package, not the resolved environment, so constrain it here.
constraint-dependencies = ["setuptools>=83.0.0"]
# The container images are linux/amd64, but uv only guarantees the lock has
# wheels for the platform it was locked on. Locking on Windows let the cpu
# extra pick torchvision 0.24.1+d801a34, a local-version variant that ships a
# win_arm64 wheel and nothing else, for the linux x86_64 marker branch — so
# `uv sync --locked --extra cpu` inside the Dockerfile failed outright. Naming
# the container platform here makes uv resolve to a build that actually has a
# linux x86_64 wheel, and makes a future recurrence a lock-time error on the
# contributor's machine instead of a build-time one in CI.
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "nvidia" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
