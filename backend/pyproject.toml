[project]
name = "find-backend"
version = "1.1.3"
description = "FastAPI backend and RQ worker for Find"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.140.7,<0.141",
  "uvicorn[standard]>=0.51.0,<0.52",
  "python-multipart>=0.0.32,<0.1",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "alembic>=1.18.5,<2",
  "psycopg2-binary>=2.9.11,<3",
  "pgvector==0.5.0",
  "minio==7.2.20",
  "redis==5.0.1",
  "rq>=2.10.0,<3",
  "pillow>=12.3.0",
  "numpy==1.26.3",
  "piexif==1.1.3",
  "cryptography>=48.0.1,<49",
  "passlib[bcrypt]==1.7.4",
  "argon2-cffi>=23.1.0",
  "python-dotenv==1.2.2",
  "httpx>=0.28.1,<0.29",
  "aiofiles>=25.1.0,<26",
  "slowapi>=0.1.10",
]

[project.optional-dependencies]
mock = [
  "scikit-learn==1.9.0",
]
cpu = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers>=5.14.1,<6",
  "open-clip-torch>=2.24.0",
  "opencv-python-headless==4.9.0.80",
  "ultralytics>=8.4.108",
  "insightface==0.7.3",
  "onnxruntime==1.28.0",
  "timm>=1.0.28",
  "einops>=0.8.0",
  "paddlepaddle>=3.3.1,<3.4",
  "paddleocr>=3.7.0,<4",
  "scikit-learn==1.9.0",
  "cython<3",
]
nvidia = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers>=5.14.1,<6",
  "open-clip-torch>=2.24.0",
  "opencv-python-headless==4.9.0.80",
  "ultralytics>=8.4.108",
  "insightface==0.7.3",
  "onnxruntime-gpu==1.28.0",
  "timm>=1.0.28",
  "einops>=0.8.0",
  "paddlepaddle>=3.3.1,<3.4",
  "paddleocr>=3.7.0,<4",
  "scikit-learn==1.9.0",
  "cython<3",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==0.23.3",
  "black==26.5.1",
  "ruff==0.16.0",
  "pip-audit==2.10.1",
  "scikit-learn==1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "nvidia" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "nvidia" },
]

[tool.uv]
# setuptools arrives transitively (torch, pip-audit) and resolved to 82.0.1,
# which is GHSA-affected (<83.0.0). The build-system pin above only governs
# building this package, not the resolved environment, so constrain it here.
constraint-dependencies = ["setuptools>=83.0.0"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "nvidia" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
