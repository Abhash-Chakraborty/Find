name: CI

# Trigger matrix (which paths wake which jobs):
#
#   Path pattern                    | frontend-check | backend-check | compose-check | docker-check
#   --------------------------------|----------------|---------------|---------------|-------------
#   frontend/**                     |      yes       |      no       |      no       |  only if (*)
#   backend/**, scripts/**          |      no        |      yes      |      no       |  only if (*)
#   .github/workflows/**            |      yes       |      yes      |      yes      |  only ci.yml
#   compose*.yml                    |      yes       |      yes      |      yes      |      no
#   root/shared non-doc config      |      yes       |      yes      |      no       |      yes
#   docs/**, *.md, ISSUE_TEMPLATE   |      no        |      no       |      no       |      no
#
# (*) docker-check is deliberately narrower than frontend/backend: it wakes only
#     for the Dockerfiles themselves and the dependency manifests they COPY, not
#     for every source edit. See the `docker` filter in detect-changes.

on:
  workflow_dispatch:
  push:
    branches: ["canary", "main"]
  pull_request:
    branches: ["canary", "main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce the canary promotion path
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            exit 0
          fi
          if [ "${BASE_BRANCH}" = "main" ] && [ "${HEAD_BRANCH}" != "canary" ]; then
            echo "main only accepts promotion pull requests from canary." >&2
            exit 1
          fi
          if [ "${BASE_BRANCH}" = "canary" ] && [ "${HEAD_BRANCH}" = "main" ]; then
            echo "Do not merge main backwards into canary through a pull request." >&2
            exit 1
          fi

  reference-boundary:
    name: Reference source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Reject tracked reference source
        shell: bash
        run: |
          if [[ -n "$(git ls-files -- 'reference-app/**' '@reference-app/**')" ]]; then
            echo "Reference application source must stay local and untracked." >&2
            exit 1
          fi

  release-governance:
    name: Release metadata and license
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate synchronized version and licensing
        shell: bash
        run: |
          python scripts/bump_version.py --check
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q 'license = "AGPL-3.0-only"' backend/pyproject.toml
          grep -q '"license": "AGPL-3.0-only"' frontend/package.json
          test -s NOTICE

      - name: Reject mutable action references
        shell: bash
        run: |
          if grep -R -nE 'uses: [^#]+@(v[0-9]+|main|master)[[:space:]]*$' .github/workflows; then
            echo "GitHub Actions must be pinned to immutable commit SHAs." >&2
            exit 1
          fi

  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
      docker: ${{ steps.filter.outputs.docker }}
      uncategorized: ${{ steps.uncategorized.outputs.uncategorized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - 'scripts/**'
            shared:
              - '.github/workflows/**'
              - 'compose*.yml'
            # Only the image inputs, not all of frontend/** and backend/**.
            # An image build is expensive, and editing a React component or a
            # router cannot break a Dockerfile that COPYs the whole tree
            # anyway. What *can* break it is a change to the Dockerfile, to a
            # dependency manifest it installs from, or to this file's version
            # pins -- so those are the triggers.
            docker:
              - 'frontend/Dockerfile'
              - 'frontend/.dockerignore'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - '.github/workflows/ci.yml'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: uncategorized
        with:
          predicate-quantifier: every
          filters: |
            uncategorized:
              - '**'
              - '!frontend/**'
              - '!backend/**'
              - '!scripts/**'
              - '!.github/workflows/**'
              - '!compose*.yml'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CODE_OF_CONDUCT.md'
              - '!CONTRIBUTING.md'
              - '!GSSOC_CONTRIBUTOR_GUIDE.md'
              - '!.github/ISSUE_TEMPLATE/**'

  frontend-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.uncategorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Node 24 is Active LTS. Keep this in lockstep with the `FROM
          # node:<major>-alpine` line in frontend/Dockerfile -- `docker-check`
          # asserts the two agree, so changing one alone fails CI.
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Report high/critical vulnerabilities for maintainer review.
      - run: pnpm audit --audit-level=high || true

      # Type-check, lint, format all in one pass (Biome handles lint + format)
      - run: pnpm check

      # Run the component/unit test suite (vitest). Previously CI never ran it,
      # so regressions only surfaced locally — now every PR gates on it.
      - run: pnpm test

      # Ensure the production bundle actually builds — catches tree-shake bugs, type errors
      - run: pnpm build

      # Browser E2E (Playwright) — boots the built app and asserts the shell +
      # new routes render in a real Chromium. The smoke specs need no backend
      # (assert static shell only), so they run in CI without a live stack.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  backend-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.uncategorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      # Lock dependencies deterministically (uv.lock is our source of truth)
      - run: uv sync --group dev --locked

      # Report known vulnerabilities from the locked backend dependency set.
      # --desc adds advisory details for maintainer review.
      - run: uv run pip-audit --desc || true

      # Catch type errors and obvious mistakes (before runtime surprises)
      - run: uv run ruff check .

      # Enforce consistent style — don't waste review time on whitespace
      - run: uv run ruff format --check .

      # Smoke-import the FastAPI app to catch broken imports or bad config before runtime.
      - name: Backend import smoke check
        run: ML_MODE=mock uv run python -c "from find_api.main import app; print('smoke OK:', app.title)"

      # Run the full backend test suite. Previously CI ran only ruff + the smoke
      # import, so the pytest suite only ever ran locally — now every PR gates on
      # it. Tests use in-memory SQLite + mocked storage/queue (see conftest), so
      # no external services are needed. ML_MODE=mock avoids loading real models.
      - name: Backend tests
        run: ML_MODE=mock uv run pytest -q

  # Hardware-acceleration acceptance across the real OS targets (plan §10.4).
  # Verifies capability detection + the forced GPU->CPU auto-fallback on each
  # platform a free CI matrix provides (Linux/macOS/Windows). The runners have
  # no GPU, which is exactly the case the low-end/edge goal must handle: forced
  # `gpu` mode must resolve to CPU with a notice and never crash. Android is not
  # a GitHub runner; it's covered by the same provider-list logic, not here.
  hardware-accel-matrix:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.uncategorized == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ML_MODE: mock
    defaults:
      run:
        # bash is present on all three runners (Git Bash on Windows), so one
        # shell keeps the steps identical across the matrix.
        shell: bash
        working-directory: ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - run: uv sync --group dev --locked

      # The capability report must resolve on every OS without a GPU, and the
      # forced-GPU path must auto-fall back to CPU with a non-blocking notice.
      # This suite includes test_forced_gpu_resolves_to_cpu_on_gpuless_host,
      # which composes live detect_capabilities() with resolve_execution("gpu")
      # — the exact §10.4 acceptance, run natively on each OS.
      - name: Hardware capability + auto-fallback acceptance
        run: uv run pytest tests/test_hardware.py tests/test_config_hardware.py -q

  compose-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        file:
          - compose.yml
          - compose.base.yml
          - compose.no-ai.yml
          - compose.mock.yml
          - compose.cpu.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate ${{ matrix.file }}
        run: docker compose --env-file .env.example -f "${{ matrix.file }}" config --quiet

  # Build both Dockerfiles on pull requests.
  #
  # Before this job, `publish.yml` was the only workflow that built them and it
  # runs on release -- so a broken Dockerfile stayed invisible until a release
  # build, and the version pins in this file drifted from the ones in the
  # images with nothing comparing them (#396).
  #
  # Build only: no push, no registry login, no QEMU/multi-arch. The backend
  # builds its default `no-ai` profile; `cpu`/`nvidia` pull multi-gigabyte
  # torch wheels and stay in the release path where they belong.
  docker-check:
    name: docker-check
    needs: detect-changes
    if: needs.detect-changes.outputs.docker == 'true' || needs.detect-changes.outputs.uncategorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The runtime versions live in two places each, and nothing used to
      # compare them: `node-version` here vs `FROM node:<major>-alpine` in
      # frontend/Dockerfile, and `python-version` here vs `ARG PYTHON_VERSION`
      # / `ARG BASE_IMAGE` in backend/Dockerfile. They agreed by coincidence.
      # Fail loudly on drift rather than discovering it at release time.
      - name: Assert CI and Dockerfile runtime pins agree
        shell: bash
        run: |
          set -euo pipefail

          # Fail if a pin is missing (grep went stale) or ambiguous.
          assert_single() {
            local label="$1" values="$2"
            if [ -z "${values}" ]; then
              echo "No ${label} pin found -- the grep for it is stale." >&2
              exit 1
            fi
            if [ "$(echo "${values}" | wc -l)" -ne 1 ]; then
              echo "${label} is pinned to more than one value:" >&2
              echo "${values}" >&2
              exit 1
            fi
          }

          ci_node="$(grep -oP 'node-version:\s*\K[0-9]+' .github/workflows/ci.yml | sort -u)"
          dockerfile_node="$(grep -oP '^FROM node:\K[0-9]+' frontend/Dockerfile | sort -u)"
          assert_single "ci.yml node-version" "${ci_node}"
          assert_single "frontend/Dockerfile node major" "${dockerfile_node}"
          if [ "${ci_node}" != "${dockerfile_node}" ]; then
            echo "Node major drift: ci.yml=${ci_node}, frontend/Dockerfile=${dockerfile_node}." >&2
            echo "Bump both in the same commit." >&2
            exit 1
          fi

          ci_python="$(grep -oP 'python-version:\s*"\K[0-9]+\.[0-9]+' .github/workflows/ci.yml | sort -u)"
          dockerfile_python="$(grep -oP '^ARG PYTHON_VERSION=\K[0-9]+\.[0-9]+' backend/Dockerfile | sort -u)"
          dockerfile_base="$(grep -oP '^ARG BASE_IMAGE=python:\K[0-9]+\.[0-9]+' backend/Dockerfile | sort -u)"
          assert_single "ci.yml python-version" "${ci_python}"
          assert_single "backend/Dockerfile PYTHON_VERSION" "${dockerfile_python}"
          assert_single "backend/Dockerfile BASE_IMAGE" "${dockerfile_base}"
          if [ "${ci_python}" != "${dockerfile_python}" ] || [ "${ci_python}" != "${dockerfile_base}" ]; then
            echo "Python drift: ci.yml=${ci_python}, PYTHON_VERSION=${dockerfile_python}, BASE_IMAGE=${dockerfile_base}." >&2
            echo "Bump all three in the same commit." >&2
            exit 1
          fi

          echo "Node ${ci_node} and Python ${ci_python} agree across CI and both Dockerfiles."

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      # Default profile (no-ai). The ML profiles are a release-time concern.
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=docker-check-backend
          cache-to: type=gha,mode=max,scope=docker-check-backend

      # `production` is the stage publish.yml ships, and it is the only one that
      # exercises the full `pnpm build` + standalone-output copy chain.
      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          cache-from: type=gha,scope=docker-check-frontend
          cache-to: type=gha,mode=max,scope=docker-check-frontend

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
